image: mcr.microsoft.com/playwright:v1.63.0-noble
stages: [quality, test]
variables:
  CI: 'true'
  TEST_ENV: production
  BASE_URL: https://digitalaptech.com
  WORKERS: '1'
  RETRIES: '1'
cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]
before_script:
  - npm ci --cache .npm --prefer-offline
quality:
  stage: quality
  script:
    - npm run check
    - npm run test:framework
smoke:
  stage: test
  script:
    - npm run test:smoke
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/, test-results/]
    reports:
      junit: reports/junit/results.xml
regression:
  stage: test
  when: manual
  script:
    - npm run test:cross-browser
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/, test-results/]
    reports:
      junit: reports/junit/results.xml
